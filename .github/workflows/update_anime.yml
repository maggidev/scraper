name: BrX Keep Alive Engine

on:
  schedule:
    # Roda a cada 13 minutos para evitar o sleep do Render (15min limit)
    - cron: '*/13 * * * *'
  workflow_dispatch: # Permite rodar manualmente no painel do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Services
        run: |
          echo "Iniciando pings de manutenção..."
          
          # 1. Ping Hugging Face Space (VS Code VPS)
          curl -I -L -s https://maggidev-vscodevpsmax.hf.space/?folder=/root/.local/codeserver-data/workspace > /dev/null
          echo "Hugging Face: OK"

          # 2. Ping Render API (BrX Sports Backend)
          curl -I -L -s https://fut-m8xk.onrender.com/ > /dev/null
          echo "Render API: OK"
          
          echo "Todos os pings enviados em $(date)"
